spring.application.name=OrderService


#spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.bootstrap-servers=my-cluster-kafka-bootstrap.kafka:9092
spring.kafka.admin.auto-create=true
#spring.kafka.properties.spring.json.trusted.packages="*"

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=true
spring.kafka.producer.properties.spring.json.type.mapping=orderEvent:com.kafka.orderservice.domain.event.OrderEvent

spring.kafka.producer.acks=all
spring.kafka.producer.retries=3
spring.kafka.producer.properties.max.in.flight.requests.per.connection=5

#spring.kafka.consumer.key-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
#spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.type.mapping=orderEvent:com.kafka.orderservice.domain.event.OrderEvent,paymentEvent:com.kafka.orderservice.domain.event.PaymentEvent,shipmentEvent:com.kafka.orderservice.domain.event.ShipmentEvent
#spring.kafka.consumer.properties.spring.deserializer.key.delegate.class=org.apache.kafka.common.serialization.StringDeserializer
#spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JsonDeserializer
#spring.kafka.consumer.properties.spring.json.value.default.type=com.kafka.orderservice.domain.event.legacy.EventEnvelope
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.consumer.group-id=order-service
spring.kafka.consumer.auto-offset-reset=earliest

spring.kafka.listener.ack-mode=record
spring.kafka.listener.concurrency=1

#spring.datasource.url=jdbc:postgresql://localhost:5432/order_service_db
spring.datasource.url=jdbc:postgresql://postgres.kafka.svc.cluster.local:5432/order_service_db
spring.datasource.username=user
spring.datasource.password=pass1234
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml
